[project]
name = "gogo"
version = "0.1.0"
description = "An engine and project manager for the Godot Engine."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
  { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = [
  "godotkit>=0.10.0,<0.11.0",
  "kq-icon-engine",
  "mistune>=3.4.0",
  "pyside6>=6.12.0",
  "typer>=0.29.0",
]

[project.scripts]
gogo = "gogo:main.main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
  "mypy>=2.4.0",
  "prek>=0.5.0,<1.0.0",
  "pytest>=8.0.0",
  "python-semantic-release>=10.0.0,<11.0.0",
  "ruff>=0.17.0",
]

[tool.uv.sources]
kq-icon-engine = { url = "https://github.com/krosseye/kq_icon_engine/releases/download/v0.1.2/kq_icon_engine-0.1.2-py3-none-any.whl" }

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
allow_zero_version = true
major_on_zero = false
build_command = "uv lock --upgrade-package gogo && git add uv.lock"

[tool.ruff.lint.per-file-ignores]
"src/gogo/{ui,cli}/**" = ["BLE001"]

[tool.mypy]
files = ["src"]
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
