[project]
name = "gogo"
version = "0.1.0"
description = "An engine and project manager for the Godot Engine."
license = { file = "LICENSE" }
readme = "README.md"
authors = [
    { name = "KROSSEYE", email = "30990184+KROSSEYE@users.noreply.github.com" },
]
requires-python = ">=3.11"
dependencies = ["httpx>=0.28.1", "pyside6>=6.10.0"]

[project.scripts]
gogo = "gogo:main"

[build-system]
requires = ["uv_build>=0.8.15,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy>=1.18.2", "pyinstaller>=6.16.0", "ruff>=0.14.1"]
